defaults:
  - override /dataset@_global_.dataset: poker_csv
  - override /model@_global_.model: text_decision_local
  - override /training@_global_.training: smoke
  - override /evaluation@_global_.evaluation: standard
  - override /inference@_global_.inference: local_service
  - override /logging@_global_.logging: local

name: llm_context_ablation
description: Compare minimal, rule-guided, few-shot, and candidate-ranking in-context contracts for the LLM decision baseline.
task: command
allow_failure: false
command:
  entrypoint: scripts/evaluate_llm_context_ablation.py
  args:
    dataset: ${dataset.root}
    out_json: ${logging.reports_dir}/llm_context_ablation.json
    out_csv: ${logging.reports_dir}/llm_context_ablation.csv
    report_out: ${logging.reports_dir}/llm_context_ablation.md
    predictions_out: ${logging.reports_dir}/llm_context_ablation_predictions.jsonl
    provider: ${model.provider}
    model_id: ${model.model_id}
    device: ${model.device}
    max_new_tokens: ${model.max_new_tokens}
    temperature: ${model.temperature}
    profiles: minimal,rules_zero_shot,rules_few_shot,candidate_ranker
    few_shot_count: 5
    max_examples: 250
    allow_missing_hole_cards: false
    missing_hole_cards: ${dataset.missing_hole_cards_train}
    keep_all_in_class: false
    seed: ${training.seed}
